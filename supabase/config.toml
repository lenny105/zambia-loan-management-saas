project_id = "zambia-loan-management-saas"
[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
[db]
major_version = 17
[storage]
enabled = true

[auth]
site_url = "https://zamloan.ezer-x.com"
additional_redirect_urls = ["https://zamloan.ezer-x.com/**", "http://localhost:3000/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
otp_length = 8
otp_expiry = 3600
max_frequency = "1s"

[functions.lenco-poll]
verify_jwt = false

[functions.subscription-receipts]
verify_jwt = false

[functions.resend-outbox]
verify_jwt = false
